name: Deploy to Netlify

# Builds the Expo web export and deploys it to Netlify on every push.
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN — a Netlify personal access token
#   NETLIFY_SITE_ID    — the target site's API ID (Site settings → Site information)

on:
  push:
    branches:
      - main
      - claude/gracious-curie-635q5h
  workflow_dispatch: {}

# Don't let overlapping pushes deploy on top of each other.
concurrency:
  group: netlify-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web export
        run: npx expo export --platform web

      - name: Deploy to Netlify
        run: npx --yes netlify-cli@17 deploy --dir=dist --prod --message "CI deploy ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
